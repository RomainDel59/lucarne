# Forward AppAPI traffic to HaRP, as required by the HaRP reverse proxy setup.
LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
LoadModule proxy_http_module /usr/lib/apache2/modules/mod_proxy_http.so
ProxyPass /exapps/ http://harp:8780/exapps/
ProxyPassReverse /exapps/ http://harp:8780/exapps/
ProxyTimeout 1800
